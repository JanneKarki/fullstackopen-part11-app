name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the deployed application
        uses: Jtalk/url-health-check-action@v5
        with:
          url: https://fullstackopen-part11-app.fly.dev/health
          max-attempts: 3
          retry-delay: 10s
