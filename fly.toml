app = 'fullstackopen-part11-app'
primary_region = 'arn'

[build]

[deploy]
  strategy = "canary"

[env]
  PORT = "3003"
  NODE_ENV = "production"

[processes]
  app = "node index.js"

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
